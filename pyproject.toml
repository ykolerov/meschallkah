[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meschallkah"
version = "0.1.0"
description = "IYPT D1 TMC2209 programmable magnetic-stirrer drive"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
video = ["numpy>=1.24", "opencv-python>=4.8"]
dev = ["pytest>=8", "numpy>=1.24"]

[tool.setuptools]
py-modules = ["tmc2209_uart", "port_discovery", "sweep", "disc_rate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
