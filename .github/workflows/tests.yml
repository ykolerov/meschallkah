name: Python simulation checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[video,dev]"
      - run: python -m pytest -q
      - run: python sweep.py check --dry-run
      - run: python sweep.py run --dry-run --table examples/smoke.csv
